// ---------- state ----------
const S={on:false,t:0,score:0,combo:0,maxCombo:0,rts:[],reps:{},pending:{},nextSpawn:0,mistakes:[],revived:false,endRoom:null};
const els={};
function buildRooms(){const box=$('#rooms');box.innerHTML='';for(const r of ROOMS){
  const d=document.createElement('div');d.className='room';d.id='room-'+r.id;
  d.innerHTML=`<div class="rh">${r.av.length>1?`<span class="av">${r.av.map(c=>`<i style="background:${c}"></i>`).join('')}</span>`:`<span class="av one" style="background:${r.av[0]}"></span>`}<b>${r.name}</b><small>${r.sub}</small><div class="rep">평판<div class="bar"><i></i></div></div></div><div class="log"></div><div class="tbar"><i></i></div><div class="acts"><button data-r="yes">넵!</button><button data-r="lol">ㅋㅋㅋ</button><button data-r="sad">ㅠㅠ</button><button data-r="ign">읽씹</button></div>`;
  box.appendChild(d);els[r.id]={card:d,log:d.querySelector('.log'),bar:d.querySelector('.tbar i'),rep:d.querySelector('.rep .bar i')};
  d.querySelectorAll('.acts button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();answer(r.id,b.dataset.r);}));}}
function addMsg(rid,who,text,me,pending){const log=els[rid].log;const m=document.createElement('div');m.className='msg'+(me?' me':'')+(pending?' pending':'');
  m.innerHTML=(me?'':`<div class="nm">${who}</div>`)+`<div class="bb"></div>`;m.querySelector('.bb').textContent=text;log.appendChild(m);
  while(log.children.length>4)log.removeChild(log.firstChild);
  requestAnimationFrame(()=>{while(log.scrollHeight>log.clientHeight+2&&log.children.length>1)log.removeChild(log.firstChild);});return m;}
function setRep(rid){const v=S.reps[rid];const i=els[rid].rep;i.style.width=Math.max(0,v)+'%';i.style.background=v>60?'#22c55e':v>30?'#f59e0b':'#ef4444';}
function flash(rid,cls){const c=els[rid].card;c.classList.remove('good','bad','shake');void c.offsetWidth;c.classList.add(cls);if(cls==='bad')c.classList.add('shake');setTimeout(()=>c.classList.remove(cls,'shake'),380);}

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='sine',v=.07,delay=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+delay;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
const sMsg=()=>{tone(1320,.08,'sine',.05);tone(1760,.1,'sine',.04,.06);};
const sOk=()=>tone(880,.08,'triangle',.05);
const sBad=()=>{tone(200,.25,'square',.05);};

// ---------- flow ----------
function spawn(){const free=ROOMS.filter(r=>!S.pending[r.id]);if(!free.length)return;const r=pick(free);
  const m=pick(r.msgs);const dur=Math.max(1.9,4.6-S.t*.034);
  const el=addMsg(r.id,m[0],m[1],false,true);S.pending[r.id]={room:r,who:m[0],text:m[1],cat:m[2],t0:S.t,dur,el};sMsg();}
function answer(rid,got){ac();if(!S.on)return;const p=S.pending[rid];if(!p)return;delete S.pending[rid];p.el.classList.remove('pending');els[rid].bar.style.width='0';
  const rt=S.t-p.t0;
  if(got!=='ign')addMsg(rid,'나',pick(REPLY[got]),true);else{const rd=document.createElement('div');rd.className='rd';rd.textContent='읽음';p.el.appendChild(rd);}
  if(got===p.cat){S.score++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);S.rts.push(rt);S.reps[rid]=Math.min(100,S.reps[rid]+4);flash(rid,'good');sOk();}
  else{S.combo=0;S.reps[rid]-=25;flash(rid,'bad');sBad();try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
    S.mistakes.push({room:p.room.name,who:p.who,text:p.text,got,exp:p.cat,back:null});const mk=S.mistakes[S.mistakes.length-1];
    const back=pick(BACK[p.cat][got]);mk.back=back;setTimeout(()=>{if(S.on||true)addMsg(rid,p.who,back,false);},320);}
  setRep(rid);updHud();checkEnd(rid);}
function timeout(rid){const p=S.pending[rid];delete S.pending[rid];p.el.classList.remove('pending');els[rid].bar.style.width='0';
  if(p.cat==='ign'){S.score++;const rd=document.createElement('div');rd.className='rd';rd.textContent='읽음 (무시 성공)';p.el.appendChild(rd);S.reps[rid]=Math.min(100,S.reps[rid]+2);}
  else{S.combo=0;S.reps[rid]-=20;flash(rid,'bad');sBad();const back=pick(BACK[p.cat].ign);S.mistakes.push({room:p.room.name,who:p.who,text:p.text,got:'ign',exp:p.cat,back});setTimeout(()=>addMsg(rid,p.who,back,false),200);}
  setRep(rid);updHud();checkEnd(rid);}
function checkEnd(rid){if(S.reps[rid]<=0&&S.on){S.on=false;S.endRoom=ROOMS.find(r=>r.id===rid);setTimeout(showResult,900);}}
function updHud(){$('#hScore').textContent=S.score;$('#hCombo').textContent=S.combo;}
let last=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(S.on){S.t+=dt;$('#hTime').textContent=S.t.toFixed(1);
    S.nextSpawn-=dt;if(S.nextSpawn<=0){spawn();S.nextSpawn=Math.max(.55,1.7-S.t*.017)*rnd(.7,1.3);}
    for(const rid in S.pending){const p=S.pending[rid];const rem=1-(S.t-p.t0)/p.dur;els[rid].bar.style.width=Math.max(0,rem*100)+'%';if(rem<=0)timeout(rid);}}
  requestAnimationFrame(loop);}
function start(){buildRooms();Object.assign(S,{on:false,t:0,score:0,combo:0,maxCombo:0,rts:[],pending:{},nextSpawn:.2,mistakes:[],revived:false,endRoom:null});
  for(const r of ROOMS){S.reps[r.id]=100;setRep(r.id);}updHud();$('#hTime').textContent='0.0';
  $('#title').classList.add('hidden');$('#result').classList.add('hidden');
  const cd=$('#countdown');cd.classList.remove('hidden');let n=3;cd.textContent=n;const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);cd.classList.add('hidden');S.on=true;}else cd.textContent=n;},650);}

// ---------- result ----------
function grade(){const s=S.score;return s<12?'눈치 0단':s<25?'사회생활 새내기':s<45?'프로 넵러':s<70?'단톡 마스터':'인간 넵봇';}
function worst(){const m=S.mistakes;if(!m.length)return null;return m.find(x=>x.room==='회사 단톡'&&x.got==='lol')||m.find(x=>x.exp==='sad'&&x.got==='lol')||m.find(x=>x.exp==='ign'&&x.got!=='ign')||m[0];}
const avgRt=()=>S.rts.length?S.rts.reduce((a,b)=>a+b,0)/S.rts.length:0;
function showResult(){
  if(S.score>BEST){BEST=S.score;try{localStorage.setItem('nep_best',BEST);}catch(e){}}
  $('#rRoom').textContent=S.endRoom.name;$('#rSys').textContent=S.endRoom.end[1];$('#rEnd').textContent=S.endRoom.end[0];
  $('#rStats').innerHTML=`처리한 메시지 ${S.score}개<br>평균 답장 ${avgRt().toFixed(2)}초<br>최고 연속 ${S.maxCombo}번<br>눈치 레벨: ${grade()}`;
  const w=worst();const box=$('#rWorst');box.innerHTML='';
  if(w){box.classList.remove('hidden');
    const a=document.createElement('div');a.className='msg';a.innerHTML='<div class="nm"></div><div class="bb"></div>';a.querySelector('.nm').textContent=w.who;a.querySelector('.bb').textContent=w.text;box.appendChild(a);
    if(w.got!=='ign'){const b=document.createElement('div');b.className='msg me';b.innerHTML='<div class="bb"></div>';b.querySelector('.bb').textContent=pick(REPLY[w.got]);box.appendChild(b);}
    else{const b=document.createElement('div');b.className='rd';b.style.textAlign='right';b.textContent='읽음';box.appendChild(b);}
    const c=document.createElement('div');c.className='msg';c.innerHTML='<div class="nm"></div><div class="bb"></div>';c.querySelector('.nm').textContent=w.who;c.querySelector('.bb').textContent=w.back;box.appendChild(c);}
  else box.classList.add('hidden');
  $('#bRevive').classList.toggle('hidden',S.revived);
  $('#result').classList.remove('hidden');$('#result').scrollTop=0;}

// ---------- ads (연결 지점) ----------
// 배너: #adBanner 자리에 애드센스 코드 삽입 (카카오 애드핏은 2026-09-02부터 초대·승인제)
// 보상형: 애드센스 H5 게임 광고(adBreak type:'reward') 승인 후 연결. 그 전엔 데모 오버레이.
const Ads={rewarded(){return new Promise(r=>{const o=$('#adov');o.classList.remove('hidden');let n=3;$('#adt').textContent=n+'초 후 보상';const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);o.classList.add('hidden');r(true);}else $('#adt').textContent=n+'초 후 보상';},1000);});}};
$('#bRevive').onclick=async()=>{const ok=await Ads.rewarded();if(!ok)return;S.revived=true;for(const r of ROOMS){S.reps[r.id]=Math.max(S.reps[r.id],60);setRep(r.id);}
  for(const rid in S.pending){S.pending[rid].el.classList.remove('pending');delete S.pending[rid];els[rid].bar.style.width='0';}
  $('#result').classList.add('hidden');S.nextSpawn=1;S.on=true;};
$('#bStart').onclick=()=>{ac();start();};
$('#bRetry').onclick=()=>start();

// ---------- share ----------
function wrap(g,text,maxW){const out=[];let line='';for(const ch of text){const t=line+ch;if(g.measureText(t).width>maxW&&line){out.push(line);line=ch;}else line=t;}if(line)out.push(line);return out;}
function bubble(g,x,y,text,me,name){g.font='600 38px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';const lines=wrap(g,text,600);const w=Math.max(...lines.map(l=>g.measureText(l).width))+48,h=lines.length*50+30;
  let top=y;if(name&&!me){g.fillStyle='#374151';g.font='600 28px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';g.fillText(name,x+8,y+28);top=y+40;g.font='600 38px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';}
  const bx=me?1080-80-w:x;g.fillStyle=me?'#fee500':'#fff';g.beginPath();g.roundRect(bx,top,w,h,[me?28:8,me?8:28,28,28]);g.fill();g.fillStyle='#191919';lines.forEach((l,i)=>g.fillText(l,bx+24,top+54+i*50));return top+h+22;}
function makeCard(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const g=c.getContext('2d');const F='-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  g.fillStyle='#b2c7d9';g.fillRect(0,0,1080,1350);g.fillStyle='#a3b8cb';g.fillRect(0,0,1080,150);
  g.fillStyle='#fee500';g.beginPath();g.roundRect(70,40,190,80,18);g.fill();g.fillStyle='#191919';g.font='900 60px '+F;g.fillText('넵!',108,103);
  g.font='700 34px '+F;g.fillText('단톡방 3개 동시 생존 게임',290,95);
  g.font='900 88px '+F;g.fillText(S.endRoom.end[0],70,280);g.font='600 36px '+F;g.fillStyle='#374151';g.fillText(S.endRoom.end[1],70,335);
  g.fillStyle='#191919';g.font='800 40px '+F;g.fillText(`처리 ${S.score}개 · 평균 ${avgRt().toFixed(2)}초 · ${grade()}`,70,410);
  const w=worst();let y=470;
  if(w){g.fillStyle='#374151';g.font='800 32px '+F;g.fillText('오늘의 대참사 · '+w.room,70,y);y+=30;y=bubble(g,70,y,w.text,false,w.who);if(w.got!=='ign')y=bubble(g,70,y,pick(REPLY[w.got]),true);y=bubble(g,70,y,w.back,false,w.who);}
  g.fillStyle='#191919';g.font='800 40px '+F;g.textAlign='center';g.fillText('너는 몇 개 버팀? 넵!',540,1290);return c;}
$('#bShare').onclick=async()=>{const c=makeCard();const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const text=`[넵!] ${S.endRoom.end[0]} · 처리 ${S.score}개 · ${grade()} ㅋㅋ 너도 해봐 ${location.href.startsWith('http')?location.href:''}`;
  try{const f=new File([blob],'nep.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nep.png';document.body.appendChild(a);a.click();a.remove();
  try{await navigator.clipboard.writeText(text);toast('이미지 저장 + 공유 문구 복사됨');}catch(e){toast('이미지를 저장했어요');}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.opacity=0,2000);}

buildRooms();$('#tBest').textContent=BEST?('내 최고 기록 '+BEST+'개'):'';requestAnimationFrame(loop);
window.__nep={S,answer,makeCard,showResult};
})();
</script>
<script>(function(){var G=(location.pathname.split('/').pop()||'index').replace('.html','')||'index';var on=/pages\.dev$|github\.io$/.test(location.hostname);function T(k){if(!on)return;try{fetch('https://abacus.jasoncameron.dev/hit/ddanjit-lab/'+G+'-'+k,{keepalive:true});}catch(e){}}window.__track=T;T('visit');document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button,a');if(!b)return;var id=b.id||'';if(id==='bStart'||id==='bPlay'||b.classList.contains('train'))T('start');else if(id==='bShare')T('share');else if(id==='bRetry'||id==='bAgain'||id==='bNext'||id==='bFailRetry')T('retry');else if(id==='bRevive'||id==='bFailAd')T('revive');},true);var r=document.getElementById('result');if(r&&window.MutationObserver){new MutationObserver(function(){if(!r.classList.contains('hidden'))T('end');}).observe(r,{attributes:true,attributeFilter:['class']});}})();</script>
