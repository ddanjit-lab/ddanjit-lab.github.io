<!doctype html>
<html lang="ko">
<head>

<title>키오스크 지옥 - 햄버거 하나 주문하는 게 이렇게 어렵다</title>
<meta name="description" content="점점 사악해지는 키오스크에서 주문서대로 주문하라. 부모님은 몇 초?">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;word-break:keep-all;height:100%;background:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:#111;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;background:#374151;display:flex;flex-direction:column;padding:8px;gap:8px}
#mission{background:#fffdf6;border-radius:2px;padding:8px 74px 10px 12px;box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative;border-bottom:2px dashed #d6cfbf;font-family:ui-monospace,Menlo,'Apple SD Gothic Neo',monospace}
#mission .lv{font-size:11px;font-weight:700;color:#7a7063}
#mission .items{font-size:15px;font-weight:800;line-height:1.45;margin-top:2px}
#mission .items span{display:block;font-weight:700}#mission .items span:before{content:'- '}
#mission .tm{position:absolute;right:10px;top:8px;font-size:20px;font-weight:900;color:#111}
#mission .tm small{font-size:11px;color:#6b7280;font-weight:700;display:block;text-align:right}
#kiosk{flex:1;min-height:0;background:#fff;border-radius:18px;border:8px solid #111;position:relative;overflow:hidden;display:flex;flex-direction:column}
#queue{height:52px;display:flex;align-items:flex-end;gap:4px;padding:0 4px;position:relative}
.person{position:relative;line-height:0}
.person .say{position:absolute;bottom:34px;left:-6px;background:#fff;border-radius:8px;padding:2px 6px;font-size:11px;white-space:nowrap;font-weight:700;animation:pop .2s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.kh{background:#dc2626;color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.kh b{font-size:17px;letter-spacing:-.5px}
.kh small{font-size:11px;opacity:.85}
.kb{flex:1;min-height:0;overflow-y:auto;position:relative}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:20px;text-align:center}
.bigbtn{border:0;border-radius:18px;padding:26px 10px;font:inherit;font-weight:900;font-size:22px;cursor:pointer;width:100%}
.red{background:#dc2626;color:#fff}.gray{background:#e5e7eb;color:#111}.dark{background:#111;color:#fff}.yellow{background:#facc15;color:#111}
.tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid #eee;background:#fafafa}
.tabs.scroll{overflow-x:auto;flex-wrap:nowrap}
.tabs button{flex:0 0 auto;border:0;border-radius:18px;padding:8px 12px;font:inherit;font-weight:800;font-size:14px;background:#eee;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#dc2626;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.item{border:1px solid #eee;border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;background:#fff}
.item .em{font-size:30px}
.item .nm{font-size:13px;font-weight:800;margin-top:2px;word-break:keep-all;line-height:1.2}
.item .pr{font-size:11px;color:#6b7280}
.item .nw{display:inline-block;background:#dc2626;color:#fff;font-size:9px;border-radius:4px;padding:0 3px}
.cartbar{display:flex;align-items:center;gap:8px;padding:8px;border-top:2px solid #eee;background:#fff}
.cartbar .ci{flex:1;font-size:12px;color:#374151;line-height:1.3;max-height:44px;overflow:hidden}
.cartbar button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:900;font-size:15px;cursor:pointer}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:5;padding:14px}
.mbox{background:#fff;border-radius:16px;width:100%;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;max-height:100%;overflow-y:auto}
.mbox h3{margin:0 0 4px;font-size:18px}
.mbox p{margin:0;color:#4b5563;font-size:13px}
.opt{border:2px solid #eee;border-radius:12px;padding:12px;font:inherit;font-weight:800;font-size:15px;background:#fff;cursor:pointer;text-align:left;display:flex;justify-content:space-between}
.opt:active{border-color:#dc2626}
.tiny{border:0;background:none;color:#9ca3af;font:inherit;font-size:11px;cursor:pointer;padding:4px;align-self:center;text-decoration:underline}
.tinyc{position:absolute;left:10px;bottom:6px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.list{display:flex;flex-direction:column;gap:6px;padding:10px}
.li{display:flex;align-items:center;gap:8px;border:1px solid #eee;border-radius:10px;padding:8px}
.li .t{flex:1;font-size:14px;font-weight:700}
.li .t small{display:block;color:#6b7280;font-weight:600;font-size:12px}
.li button{border:0;border-radius:8px;background:#f3f4f6;font:inherit;font-weight:900;cursor:pointer;padding:6px 9px}
.li.tinyq button{padding:1px 4px;font-size:10px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{border:0;border-radius:10px;background:#f3f4f6;padding:12px;font:inherit;font-weight:800;font-size:18px}
.adv{position:absolute;inset:0;background:linear-gradient(135deg,#f97316,#dc2626);color:#fff;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.adv .x{position:absolute;right:8px;top:6px;font-size:12px;color:rgba(255,255,255,.7);background:none;border:0;cursor:pointer;padding:6px}
.adv .burger{font-size:90px;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateY(-10px) rotate(6deg)}}
.shake{animation:sh .3s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ov{position:absolute;inset:0;background:rgba(17,24,39,.94);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;z-index:20;overflow-y:auto}
.hidden{display:none!important}
.title{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1.05}
.title span{color:#f87171}
.sub{color:#d1d5db;font-size:15px;font-weight:600}
.btn{width:100%;max-width:320px;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:900;font-size:17px;cursor:pointer;background:#dc2626;color:#fff}
.btn.g{background:#4b5563}
.btn.ghost{background:none;color:#9ca3af;font-size:14px;padding:6px;text-decoration:none;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:320px}
.st{background:rgba(255,255,255,.08);border-radius:12px;padding:9px}
.st span{display:block;font-size:11px;color:#9ca3af}.st b{font-size:18px}
.adslot{width:320px;max-width:100%;height:100px;border:1px dashed rgba(255,255,255,.25);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#6b7280}
#toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;font-weight:800;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none;text-align:center;max-width:90%}
.rcpt{width:100%;max-width:320px;background:#fffdf6;color:#222;padding:18px 18px 22px;font-family:ui-monospace,Menlo,"Apple SD Gothic Neo",monospace;font-size:13px;line-height:1.6;text-align:left;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.4);-webkit-mask:radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 0/12px 100% repeat-x;mask:radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 0/12px 100% repeat-x}
.rcpt p{margin:0 0 6px}
.rh1{text-align:center;font-size:11px;color:#777}
.rh2{text-align:center;font-size:22px;font-weight:800;margin:4px 0}
.rl{border-top:1px dashed #999;margin:10px 0}
.rrow{display:flex;justify-content:space-between;gap:8px}
.rtot{display:flex;justify-content:space-between;font-size:18px;font-weight:800}
.rsmall{font-size:11px;color:#777;text-align:center;margin-top:8px}
.ov{background:rgba(30,32,36,.9)}
</style>

<body>
<div id="app">
  <div id="mission"><div class="lv" id="mLv"></div><div class="items" id="mItems"></div><div class="tm"><span id="mTime">0.0</span><small>총 <span id="mTotal">0</span>초</small></div></div>
  <div id="kiosk"></div>
  <div id="queue"></div>

  <div id="title" class="ov">
    <div class="rcpt">
      <div class="rh1">버거천국 · 무인주문</div>
      <div class="rh2">키오스크 지옥</div>
      <div class="rl"></div>
      <p>위에 뜨는 주문서대로 주문만 하면 됩니다.</p>
      <p>근데 단계가 올라갈수록 키오스크가 이상해집니다. 세트 권유, 적립 권유, 광고, 타임아웃...</p>
      <p>한 단계에 60초가 넘으면 뒷사람이 대신 눌러줍니다.</p>
      <div class="rl"></div>
      <div class="rrow"><span>총 5단계</span><span>부모님과 기록 비교 가능</span></div>
      <div id="tBest" class="rsmall"></div>
    </div>
    <button class="btn" id="bStart">주문 시작</button>
  </div>
  <div id="fail" class="ov hidden">
    <div class="rcpt">
      <div class="rh2" id="fTitle">주문 실패</div>
      <div class="rl"></div>
      <p id="fSub"></p>
    </div>
    <button class="btn" id="bFailRetry">이 단계 다시 (+15초)</button>
    <button class="btn g" id="bFailAd">광고 보고 페널티 없이 다시</button>
  </div>
  <div id="result" class="ov hidden">
    <div class="rcpt" id="rcpt"></div>
    <button class="btn" id="bShare">영수증 부모님께 보내기</button>
    <button class="btn g" id="bRetry">처음부터 다시</button>
    <a class="btn ghost" href="index.html">다른 게임</a>
  </div>
  <div id="adov" class="ov hidden" style="z-index:40"><div class="adslot" style="height:240px">광고 (데모)</div><div id="adt" class="sub"></div></div>
  <div id="toast"></div>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let BEST=0;try{BEST=+localStorage.getItem('kiosk_best')||0;}catch(e){}

// ---------- menu ----------
const MENU={
 burger:[['치즈버거','🍔',4300],['불고기버거','🍔',4500],['새우버거','🍤',4800],['치킨버거','🍗',5000],['더블불고기버거','🍔',6200],['빅버거','🍔',6500]],
 confuse:[['불고기버거(신)','🍔',4700,1],['불고기버거 라이트','🍔',4400],['새우버거 스파이시','🍤',5000,1],['치즈버거 더블','🍔',5600]],
 side:[['감자튀김','🍟',1900],['치즈스틱','🧀',2300],['코울슬로','🥗',1800],['너겟','🍗',2400]],
 drink:[['콜라','🥤',1800],['사이다','🥤',1800],['아메리카노','☕',2000],['오렌지주스','🧃',2300]],
 drinkZero:[['제로콜라','🥤',1800],['제로사이다','🥤',1800]],
 dessert:[['애플파이','🥧',1500],['아이스크림콘','🍦',1000],['선데','🍨',2000]]
};
const allDrinks=()=>MENU.drink.concat(MENU.drinkZero);
function food(name,s=46){const v=`viewBox="0 0 60 60" width="${s}" height="${s}"`;const n=name||'';
 if(/버거/.test(n)){const dbl=/더블|빅/.test(n),ch=/치즈/.test(n),sh=/새우/.test(n),ck=/치킨/.test(n);const pat=sh?'#f08a4b':ck?'#d9a045':'#6b3a22';let y=34,layers='';
  const patty=yy=>`<rect x="9" y="${yy}" width="42" height="7" rx="3.5" fill="${pat}"/>`;layers+=patty(y);if(ch)layers+=`<path d="M9 ${y-1} h42 l-6 5 l-6 -4 l-6 4 l-6 -4 l-6 4 l-6 -4z" fill="#f7c948"/>`;if(dbl){y-=8;layers+=patty(y);}
  return `<svg ${v}><path d="M8 ${y-3} q22 -${dbl?20:24} 44 0z" fill="#e0a458"/><circle cx="22" cy="${y-12}" r="1" fill="#fff6"/><circle cx="33" cy="${y-15}" r="1" fill="#fff6"/><circle cx="40" cy="${y-10}" r="1" fill="#fff6"/><path d="M8 ${y-2} q4 3 8 0 q4 3 8 0 q4 3 8 0 q4 3 8 0 q4 3 8 0 q4 3 4 0 v2 h-44z" fill="#6cbf4b"/>${layers}<path d="M9 43 h42 q0 7 -8 7 h-26 q-8 0 -8 -7z" fill="#d4934a"/></svg>`;}
 if(/감자/.test(n))return `<svg ${v}>${[14,20,26,32,38,44].map((x,i)=>`<rect x="${x-2}" y="${10+(i%3)*3}" width="5" height="26" rx="1.5" fill="#f5c542"/>`).join('')}<path d="M12 24 h36 l-4 28 h-28z" fill="#d7282f"/><path d="M22 34 q8 6 16 0" stroke="#f5c542" stroke-width="2" fill="none"/></svg>`;
 if(/치즈스틱/.test(n))return `<svg ${v}>${[0,1,2].map(i=>`<rect x="${10+i*4}" y="${16+i*9}" width="40" height="9" rx="4.5" fill="#e8a33d" transform="rotate(-8 30 30)"/>`).join('')}</svg>`;
 if(/코울/.test(n))return `<svg ${v}><ellipse cx="30" cy="30" rx="20" ry="8" fill="#e9f5e1"/><path d="M10 30 q20 26 40 0z" fill="#fff" stroke="#ccc"/><circle cx="24" cy="29" r="2" fill="#f28b30"/><circle cx="33" cy="28" r="2" fill="#7cc24a"/></svg>`;
 if(/너겟|치킨 1/.test(n))return `<svg ${v}><ellipse cx="22" cy="34" rx="11" ry="9" fill="#d9a045"/><ellipse cx="38" cy="30" rx="11" ry="9" fill="#e3ae55"/><ellipse cx="30" cy="42" rx="10" ry="7" fill="#c98f3a"/></svg>`;
 if(/파이/.test(n))return `<svg ${v}><rect x="10" y="20" width="40" height="22" rx="5" fill="#e0a458"/><path d="M18 26 l6 10 M28 24 l6 12 M38 26 l6 10" stroke="#b87333" stroke-width="2"/></svg>`;
 if(/콘/.test(n))return `<svg ${v}><circle cx="30" cy="20" r="11" fill="#fff4e0"/><path d="M20 24 l10 30 l10 -30z" fill="#d9a045"/></svg>`;
 if(/선데/.test(n))return `<svg ${v}><path d="M16 24 h28 l-5 26 h-18z" fill="#fff" stroke="#ddd"/><path d="M18 24 q12 -16 24 0" fill="#fff4e0"/><path d="M20 24 q10 6 20 0" stroke="#7b3f1d" stroke-width="3" fill="none"/></svg>`;
 if(/아메리카노|라떼/.test(n))return `<svg ${v}><path d="M18 16 h24 l-3 36 h-18z" fill="#f4efe6" stroke="#bbb"/><rect x="16" y="12" width="28" height="6" rx="2" fill="#6b4a33"/><rect x="19" y="28" width="22" height="10" fill="#b98a5e"/></svg>`;
 const cup={콜라:'#d7282f',제로콜라:'#1f1f1f',사이다:'#2f9e44',제로사이다:'#1f1f1f',오렌지주스:'#f28b30'}[n]||'#888';
 return `<svg ${v}><rect x="28" y="4" width="3" height="14" fill="#e5e5e5" transform="rotate(12 30 10)"/><rect x="15" y="14" width="30" height="5" rx="2" fill="#eee"/><path d="M17 19 h26 l-3 33 h-20z" fill="${cup}"/><rect x="20" y="30" width="20" height="8" fill="#fff3" /></svg>`;}
function personSVG(i){const c=['#5b6b8c','#8c6b5b','#6b8c70','#8c5b7a','#4a4a4a'][i%5],h=['#2b2b2b','#5a3b24','#8b8b8b','#2b2b2b','#3b2b1b'][i%5],t=34+(i*7%9);return `<svg width="26" height="${t+4}" viewBox="0 0 26 ${t+4}"><rect x="4" y="16" width="18" height="${t-12}" rx="7" fill="${c}"/><circle cx="13" cy="10" r="7" fill="#e9c9a6"/><path d="M6 9 q7 -10 14 0 q-2 -3 -7 -3 q-5 0 -7 3z" fill="${h}"/></svg>`;}
const LV=[
 {n:1,name:'평범한 키오스크',evil:{}},
 {n:2,name:'세트 권유 키오스크',evil:{upsell:1,set:1}},
 {n:3,name:'적립 집착 키오스크',evil:{upsell:1,set:1,large:1,idle:8,swap:1,confuse:1,zeroHidden:1,points:1}},
 {n:4,name:'광고 키오스크',evil:{upsell:1,set:1,large:1,idle:7,swap:1,confuse:1,zeroHidden:1,points:1,startAd:1,tinyQty:1,tabs:1}},
 {n:5,name:'최종 보스 키오스크',evil:{upsell:1,set:1,large:1,idle:5,swap:1,confuse:1,zeroHidden:1,points:1,startAd:1,tinyQty:1,tabs:1,shufflePay:1,coupon:1,review:1}}
];
function mkMission(n){const bn=()=>pick(MENU.burger)[0],sd=()=>pick(MENU.side)[0],dr=()=>pick(allDrinks())[0],ds=()=>pick(MENU.dessert)[0];
  const place=pick(['매장','포장']);let items,pay='카드';
  if(n===1)items=[{name:pick(['치즈버거','새우버거','불고기버거']),type:'단품',qty:1}];
  else if(n===2)items=[{name:bn(),type:'세트',side:sd(),drink:pick(MENU.drinkZero.concat(MENU.drink))[0],qty:1}];
  else if(n===3){items=[{name:pick(['불고기버거','새우버거','치즈버거']),type:'라지세트',side:sd(),drink:pick(MENU.drinkZero)[0],qty:1},{name:ds(),qty:1}];pay=pick(['카드','간편결제']);}
  else if(n===4){items=[{name:bn(),type:'단품',qty:2},{name:pick(MENU.drinkZero)[0],qty:1},{name:sd(),qty:1}];pay=pick(['카드','간편결제']);}
  else{const b1=bn();let b2=bn();while(b2===b1)b2=bn();items=[{name:b1,type:'세트',side:sd(),drink:dr(),qty:1},{name:b2,type:'라지세트',side:sd(),drink:pick(MENU.drinkZero)[0],qty:1},{name:ds(),qty:1}];pay=pick(['카드','간편결제']);}
  return{items,place,pay};}
const key=i=>[i.name,i.type||'',i.side||'',i.drink||''].join('|');
function descItem(i){let s=i.name;if(i.type)s+=' '+i.type;if(i.side||i.drink)s+=` (${[i.side,i.drink].filter(Boolean).join(', ')})`;if(i.qty>1)s+=' ×'+i.qty;return s;}

// ---------- state ----------
const S={lv:0,mission:null,cart:[],place:null,pay:null,screen:'start',tab:'burger',t:0,total:0,on:false,lastAct:0,idleWarn:null,modal:null,stats:{upsell:0,timeout:0,wrong:0,fails:0},pend:null,queue:[],adShown:false};
const E=()=>LV[S.lv].evil;
function act(){S.lastAct=S.t;}
function toast(t,ms=1400){const e=$('#toast');e.innerHTML=t;e.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.opacity=0,ms);}
function beep(f=880){try{const a=beep.ac||(beep.ac=new(window.AudioContext||window.webkitAudioContext)());if(a.state==='suspended')a.resume();const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.12);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.13);}catch(e){}}

// ---------- rendering ----------
const K=()=>$('#kiosk');
function header(){return `<div class="kh"><b>버거천국</b><small>${S.place?S.place+' 주문':'BURGER HEAVEN'}</small></div>`;}
function render(){act();const e=E();let h=header();
  if(S.screen==='start'){h+=`<div class="kb"><div class="center"><div>${food('불고기버거',90)}${food('감자튀김',70)}${food('콜라',70)}</div><div style="font-size:24px;font-weight:900">주문하시려면<br>화면을 터치하세요</div><button class="bigbtn red" data-a="touch">주문하기</button></div></div>`;
    if(e.startAd&&!S.adShown)h+=`<div class="adv"><button class="x" data-a="closead">광고 닫기 ✕</button><div class="burger">${food('더블불고기버거',130)}</div><div style="font-size:26px;font-weight:900">신메뉴 트리플 치즈 폭탄버거</div><div style="font-size:15px">지금 주문하면 콜라 무료 업그레이드!</div><button class="bigbtn yellow" data-a="adclick" style="width:80%">지금 주문하기</button></div>`;}
  else if(S.screen==='place'){const a=`<button class="bigbtn ${e.swap?'gray':'red'}" data-a="place" data-v="매장">매장에서<br>먹을게요</button>`,b=`<button class="bigbtn ${e.swap?'red':'gray'}" data-a="place" data-v="포장">포장<br>할게요</button>`;
    h+=`<div class="kb"><div class="center"><div style="font-size:20px;font-weight:900">식사 장소를 선택하세요</div><div class="row" style="width:100%">${e.swap?b+a:a+b}</div></div></div>`;}
  else if(S.screen==='menu'){const tabs=e.tabs?[['rec','추천'],['new','신메뉴'],['burger','버거'],['chicken','치킨'],['side','사이드'],['dessert','디저트'],['coffee','커피'],['drink','음료']]:[['burger','버거'],['side','사이드'],['drink','음료'],['dessert','디저트']];
    h+=`<div class="tabs ${e.tabs?'scroll':''}">${tabs.map(([k,v])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${v}</button>`).join('')}</div><div class="kb"><div class="grid">${menuItems().map(it=>`<div class="item" data-a="item" data-v="${it[0]}" data-k="${it.k}"><div class="em">${it.k==='zeroMore'?'<div style="height:46px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#999">+</div>':food(it[0])}</div><div class="nm">${it[0]} ${it[3]?'<span class="nw">NEW</span>':''}</div><div class="pr">${it[2].toLocaleString()}원</div></div>`).join('')||'<div style="grid-column:1/-1;text-align:center;color:#9ca3af;padding:30px">준비 중인 메뉴입니다</div>'}</div></div>`;
    h+=`<div class="cartbar"><div class="ci">${S.cart.length?S.cart.map(descItem).join(' / '):'장바구니가 비어 있어요'}</div><button class="gray" data-a="home">처음으로</button><button class="red" data-a="checkout">결제하기</button></div>`;}
  else if(S.screen==='cart'){h+=`<div class="kb"><div class="list"><div style="font-weight:900;font-size:17px">주문 내역을 확인해 주세요</div>${S.cart.map((c,i)=>`<div class="li ${e.tinyQty?'tinyq':''}"><div class="t">${c.name} ${c.type||''}<small>${[c.side,c.drink].filter(Boolean).join(' · ')}</small></div><button data-a="dec" data-v="${i}">−</button><b>${c.qty}</b><button data-a="inc" data-v="${i}">+</button><button data-a="del" data-v="${i}">✕</button></div>`).join('')||'<div style="color:#9ca3af">비어 있음</div>'}</div></div>
      <div class="cartbar"><button class="gray" data-a="back" style="flex:1">메뉴 더 담기</button><button class="red" data-a="confirm" style="flex:1">주문 확인</button></div>`;}
  else if(S.screen==='pay'){let ps=['카드','간편결제','쿠폰·기프티콘'];if(e.shufflePay)ps=shuffle(ps);const icon={카드:'','간편결제':'','쿠폰·기프티콘':''};
    h+=`<div class="kb"><div class="center"><div style="font-size:20px;font-weight:900">결제 수단을 선택하세요</div>${ps.map(p=>`<button class="bigbtn ${e.shufflePay?pick(['gray','red','yellow']):p==='카드'?'red':'gray'}" data-a="pay" data-v="${p}" style="padding:18px">${p}</button>`).join('')}<button class="tiny" data-a="back2">이전</button></div></div>`;}
  else if(S.screen==='paying'){h+=`<div class="kb"><div class="center"><div style="width:90px;height:58px;border-radius:8px;background:${S.pay==='카드'?'linear-gradient(135deg,#334155,#64748b)':'#111'};margin:0 auto"></div><div style="font-size:20px;font-weight:900">${S.pay==='카드'?'카드를 투입구에 꽂아주세요':'바코드를 스캔해 주세요'}</div><div style="color:#6b7280">결제 중...</div></div></div>`;}
  K().innerHTML=h+(S.modal?`<div class="modal">${S.modal}</div>`:'');}
function menuItems(){const e=E();let arr=[];const t=S.tab;
  if(t==='burger'||t==='rec'){arr=MENU.burger.slice();if(e.confuse)arr=shuffle(arr.concat(MENU.confuse));if(t==='rec')arr=arr.slice(0,4);arr=arr.map(x=>Object.assign(x.slice(),{k:'burger'}));}
  else if(t==='new'){arr=MENU.confuse.filter(x=>x[3]).map(x=>Object.assign(x.slice(),{k:'burger'}));}
  else if(t==='side')arr=MENU.side.map(x=>Object.assign(x.slice(),{k:'side'}));
  else if(t==='drink')arr=(e.zeroHidden?MENU.drink:allDrinks()).map(x=>Object.assign(x.slice(),{k:'drink'})).concat(e.zeroHidden?[Object.assign(['제로·기타 음료 보기 ▸','',0],{k:'zeroMore'})]:[]);
  else if(t==='zero')arr=MENU.drinkZero.map(x=>Object.assign(x.slice(),{k:'drink'}));
  else if(t==='dessert')arr=MENU.dessert.map(x=>Object.assign(x.slice(),{k:'dessert'}));
  else if(t==='coffee')arr=[Object.assign(['아메리카노','☕',2000],{k:'drink'}),Object.assign(['카페라떼','☕',2800],{k:'drink'})];
  else if(t==='chicken')arr=[Object.assign(['치킨 1조각','🍗',2500],{k:'side'}),Object.assign(['너겟','🍗',2400],{k:'side'})];
  return arr;}
function modal(html){S.modal=html;render();}
function closeModal(){S.modal=null;render();}
function addCart(item){const k=key(item);const ex=S.cart.find(c=>key(c)===k);if(ex)ex.qty+=item.qty||1;else S.cart.push(Object.assign({qty:1},item));beep(1200);}

// ---------- item flow ----------
function chooseType(name){const e=E();const types=['단품','세트'].concat(e.large?['라지세트']:[]);if(!e.set){addCart({name,type:'단품'});render();return;}
  S.pend={name};modal(`<div class="mbox"><h3>${name}</h3><p>구성을 선택하세요</p>${types.map(t=>`<button class="opt" data-a="type" data-v="${t}"><span>${t}</span><span>${t==='단품'?'':'+'+(t==='세트'?'2,000':'2,700')+'원'}</span></button>`).join('')}<button class="tiny" data-a="cancel">취소</button></div>`);}
function afterType(t){const e=E();S.pend.type=t;
  if(t==='단품'){if(e.upsell){modal(`<div class="mbox"><h3>세트로 바꾸시면 더 든든해요!</h3><p>감자튀김 + 음료 추가, 지금만 특가</p><button class="bigbtn red" data-a="upset">세트로 변경할게요</button><button class="tiny" data-a="keepsingle">단품 유지</button></div>`);return;}
    addCart({name:S.pend.name,type:'단품'});S.pend=null;closeModal();return;}
  chooseSide();}
function chooseSide(){modal(`<div class="mbox"><h3>사이드를 선택하세요</h3>${MENU.side.map(s=>`<button class="opt" data-a="side" data-v="${s[0]}"><span style="display:flex;align-items:center;gap:6px">${food(s[0],30)}${s[0]}</span><span>${s[0]==='감자튀김'?'기본':'+'+(s[2]-1900>0?(s[2]-1900):0)+'원'}</span></button>`).join('')}</div>`);}
function chooseDrink(showZero){const e=E();const list=showZero?MENU.drinkZero:(e.zeroHidden?MENU.drink:allDrinks());
  modal(`<div class="mbox"><h3>음료를 선택하세요</h3>${list.map(s=>`<button class="opt" data-a="drink" data-v="${s[0]}"><span style="display:flex;align-items:center;gap:6px">${food(s[0],30)}${s[0]}</span><span>${s[0]==='콜라'?'기본':''}</span></button>`).join('')}${(!showZero&&e.zeroHidden)?'<button class="tiny" data-a="zeroopt" style="align-self:flex-end">제로·기타 음료 변경 ▸</button>':''}</div>`);}
function finishSet(){const e=E();const it={name:S.pend.name,type:S.pend.type,side:S.pend.side,drink:S.pend.drink};
  if(e.large&&it.type==='세트'){S.pend.item=it;modal(`<div class="mbox"><h3>라지로 업그레이드 하시겠어요?</h3><p>단돈 700원으로 감자튀김과 음료가 커져요!</p><button class="bigbtn red" data-a="uplarge">라지로 업그레이드</button><button class="tiny" data-a="nolarge">그대로 주문</button></div>`);return;}
  addCart(it);dessertUpsell();}
function dessertUpsell(){const e=E();S.pend=null;if(e.upsell){const d=pick(MENU.dessert);modal(`<div class="mbox"><div style="text-align:center">${food(d[0],80)}</div><h3>${d[0]} 함께 드실래요?</h3><p>세트 고객님만 +${d[2].toLocaleString()}원</p><button class="bigbtn red" data-a="updessert" data-v="${d[0]}">추가하기</button><button class="tiny" data-a="cancel">괜찮아요</button></div>`);}else closeModal();}

// ---------- checkout flow ----------
function toPoints(){modal(`<div class="mbox"><h3>포인트 적립하시겠어요?</h3><p>휴대폰 번호를 입력해 주세요</p><div style="font-size:22px;font-weight:900;text-align:center;letter-spacing:2px;padding:6px;background:#f3f4f6;border-radius:8px" id="phone">010-____-____</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'지움',0,'확인'].map(k=>`<button data-a="key" data-v="${k}">${k}</button>`).join('')}</div><button class="bigbtn red" data-a="pointsok" style="padding:14px">적립하기</button><div style="height:14px"></div><button class="tiny tinyc" data-a="nopoints">적립 안 함</button></div>`);}
function toCoupon(){modal(`<div class="mbox"><h3>쿠폰이나 기프티콘 있으세요?</h3><p>할인 쿠폰을 확인해 드려요</p><button class="bigbtn red" data-a="couponyes">쿠폰 사용하기</button><button class="tiny" data-a="couponno">없어요</button></div>`);}
function toPay(){S.modal=null;S.screen='pay';render();}
function afterConfirm(){const e=E();if(!S.cart.length){toast('장바구니가 비어 있어요');return;}if(e.points)toPoints();else if(e.coupon)toCoupon();else toPay();}
function doPay(p){const e=E();S.pay=p;if(e.review){modal(`<div class="mbox"><h3>리뷰 이벤트 참여하고 선물 받기!</h3><p>간단한 설문 3문항 (약 1분)</p><button class="bigbtn red" data-a="reviewyes">참여할게요</button><button class="tiny" data-a="reviewno">다음에</button></div>`);return;}startPaying();}
function startPaying(){S.modal=null;S.screen='paying';render();setTimeout(verify,1100);}
function verify(){const m=S.mission;const want={},got={};for(const i of m.items)want[key(i)]=(want[key(i)]||0)+i.qty;for(const i of S.cart)got[key(i)]=(got[key(i)]||0)+i.qty;
  const errs=[];for(const k in want)if(want[k]!==got[k])errs.push(`${k.split('|').filter(Boolean).join(' ')} ${got[k]?got[k]+'개 (주문서는 '+want[k]+'개)':'빠짐'}`);
  for(const k in got)if(!want[k])errs.push(`${k.split('|').filter(Boolean).join(' ')} 잘못 담음`);
  if(S.place!==m.place)errs.push(`${m.place}인데 ${S.place} 선택`);if(S.pay!==m.pay)errs.push(`${m.pay}인데 ${S.pay} 선택`);
  if(errs.length){S.stats.wrong++;fail('주문이 틀렸어요',errs.slice(0,3).join('<br>'));return;}
  S.on=false;S.total+=S.t;(S.times=S.times||[])[S.lv]=S.t;beep(1500);setTimeout(()=>beep(1900),120);
  if(S.lv>=LV.length-1){showResult();return;}
  toast(`${S.lv+1}단계 주문 완료 · ${S.t.toFixed(1)}초`,1300);setTimeout(()=>startLevel(S.lv+1),1300);}
function fail(t,sub){S.on=false;S.stats.fails++;$('#fTitle').textContent=t;$('#fSub').innerHTML=sub;$('#fail').classList.remove('hidden');}

// ---------- events ----------
K().addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||!S.on)return;const a=b.dataset.a,v=b.dataset.v;act();beep(700);
  switch(a){
   case 'touch':S.screen='place';render();break;
   case 'closead':S.adShown=true;render();break;
   case 'adclick':K().classList.add('shake');setTimeout(()=>K().classList.remove('shake'),300);toast('신메뉴는 주문서에 없어요!');break;
   case 'place':S.place=v;S.screen='menu';S.tab=E().tabs?'rec':'burger';render();break;
   case 'tab':S.tab=v;render();break;
   case 'item':{const k=b.dataset.k;if(k==='zeroMore'){S.tab='zero';render();break;}if(k==='burger')chooseType(v);else{addCart({name:v});render();}break;}
   case 'type':afterType(v);break;
   case 'upset':S.stats.upsell++;S.pend.type='세트';chooseSide();break;
   case 'keepsingle':addCart({name:S.pend.name,type:'단품'});S.pend=null;closeModal();break;
   case 'side':S.pend.side=v;chooseDrink(false);break;
   case 'zeroopt':chooseDrink(true);break;
   case 'drink':if(S.pend){S.pend.drink=v;finishSet();}break;
   case 'uplarge':S.stats.upsell++;S.pend.item.type='라지세트';addCart(S.pend.item);dessertUpsell();break;
   case 'nolarge':addCart(S.pend.item);dessertUpsell();break;
   case 'updessert':S.stats.upsell++;addCart({name:v});closeModal();break;
   case 'cancel':S.pend=null;closeModal();break;
   case 'home':S.cart=[];S.place=null;S.screen='start';S.modal=null;render();toast('장바구니가 비워졌습니다');break;
   case 'checkout':if(!S.cart.length){toast('장바구니가 비어 있어요');break;}S.screen='cart';render();break;
   case 'back':S.screen='menu';render();break;
   case 'inc':S.cart[v].qty++;render();break;
   case 'dec':if(S.cart[v].qty>1)S.cart[v].qty--;else S.cart.splice(v,1);render();break;
   case 'del':S.cart.splice(v,1);render();break;
   case 'confirm':afterConfirm();break;
   case 'key':{const el=$('#phone');if(!el)break;let d=(el.dataset.d||'');if(v==='지움')d=d.slice(0,-1);else if(v==='확인'){}else if(d.length<8)d+=v;el.dataset.d=d;const p=(d+'________').slice(0,8);el.textContent='010-'+p.slice(0,4)+'-'+p.slice(4);break;}
   case 'pointsok':toast('등록되지 않은 번호입니다.<br>회원가입 하시겠어요?');break;
   case 'nopoints':if(E().coupon)toCoupon();else toPay();break;
   case 'couponyes':modal(`<div class="mbox"><h3>쿠폰 번호 입력</h3><p>12자리 쿠폰 번호를 입력하세요</p><div style="padding:12px;background:#f3f4f6;border-radius:8px;color:#9ca3af">____-____-____</div><button class="bigbtn gray" data-a="couponno" style="padding:12px">취소</button></div>`);break;
   case 'couponno':toPay();break;
   case 'pay':doPay(v);break;
   case 'back2':S.screen='cart';render();break;
   case 'reviewyes':modal(`<div class="mbox"><h3>Q1. 키오스크 이용이 편리하셨나요?</h3>${['매우 그렇다','그렇다','보통','아니다'].map(x=>`<button class="opt" data-a="rq">${x}</button>`).join('')}</div>`);S.rq=0;break;
   case 'rq':S.rq++;if(S.rq>=3){toast('참여 감사합니다! 선물은 앱에서 확인하세요');startPaying();}else modal(`<div class="mbox"><h3>Q${S.rq+1}. ${S.rq===1?'직원 응대에 만족하셨나요?':'재방문 의사가 있으신가요?'}</h3>${['매우 그렇다','그렇다','보통','아니다'].map(x=>`<button class="opt" data-a="rq">${x}</button>`).join('')}</div>`);break;
   case 'reviewno':startPaying();break;
   case 'idleok':S.idleWarn=null;S.modal=null;render();break;
  }});

// ---------- level & loop ----------
function startLevel(n){S.lv=n;S.mission=mkMission(n+1);Object.assign(S,{cart:[],place:null,pay:null,screen:'start',tab:'burger',t:0,on:true,modal:null,pend:null,idleWarn:null,adShown:false,queue:[]});
  $('#mLv').textContent=`${n+1}단계 · ${LV[n].name}`;const m=S.mission;
  $('#mItems').innerHTML=m.items.map(i=>`<span>${descItem(i)}</span>`).join('')+`<span>${m.place}</span><span>${m.pay}</span>`;
  $('#mTotal').textContent=S.total.toFixed(0);$('#fail').classList.add('hidden');render();}
const SAYS=['(한숨)','아 빨리요','저기요...','에휴','뭐 시키는데 이렇게 오래 걸려','직원 불러드려요?','제가 눌러드릴까요?'];
let last=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(S.on){S.t+=dt;$('#mTime').textContent=S.t.toFixed(1);
    const e=E();
    if(e.idle&&S.screen!=='start'&&S.screen!=='paying'){const idle=S.t-S.lastAct;
      if(!S.idleWarn&&idle>e.idle){S.idleWarn={t0:S.t};S.modal=`<div class="mbox" style="text-align:center"><h3>주문을 계속하시겠어요?</h3><p><b id="idc" style="font-size:30px;color:#dc2626">3</b>초 후 처음 화면으로 돌아갑니다</p><button class="bigbtn red" data-a="idleok">계속 주문하기</button></div>`;K().insertAdjacentHTML('beforeend',`<div class="modal" id="idleM">${S.modal}</div>`);}
      if(S.idleWarn){const r=3-(S.t-S.idleWarn.t0);const c=$('#idc');if(c)c.textContent=Math.max(0,Math.ceil(r));if(r<=0){S.idleWarn=null;S.stats.timeout++;S.cart=[];S.place=null;S.screen='start';S.modal=null;render();toast('시간 초과! 처음부터 다시 주문하세요');}}}
    // queue
    const want=1+Math.floor(S.t/9);if(S.queue.length<Math.min(9,want)){S.queue.push({say:null});drawQueue();}
    if(Math.random()<dt*.35&&S.queue.length>1){const p=pick(S.queue);p.say=pick(SAYS);p.until=S.t+1.8;drawQueue();}
    for(const p of S.queue)if(p.say&&S.t>p.until){p.say=null;drawQueue();}
    if(S.t>60)fail('뒷사람 폭발','60초가 넘자 뒷사람이 대신 눌러줬습니다...');}
  requestAnimationFrame(loop);}
function drawQueue(){$('#queue').innerHTML=S.queue.map((p,i)=>`<div class="person">${personSVG(i)}${p.say?`<div class="say">${p.say}</div>`:''}</div>`).join('');}

// ---------- ads ----------
// 배너: .adslot 자리에 애드센스 코드. 보상형: 애드센스 H5 게임 광고(adBreak reward) 승인 후 연결.
const Ads={rewarded(){return new Promise(r=>{const o=$('#adov');o.classList.remove('hidden');let n=3;$('#adt').textContent=n+'초 후 보상';const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);o.classList.add('hidden');r(true);}else $('#adt').textContent=n+'초 후 보상';},1000);});}};
$('#bFailRetry').onclick=()=>{S.total+=15+S.t;startLevel(S.lv);};
$('#bFailAd').onclick=async()=>{if(await Ads.rewarded())startLevel(S.lv);};

// ---------- result & share ----------
function grade(t){return t<80?'키오스크 네이티브':t<130?'MZ 인증':t<200?'평범한 어른':t<300?'우리 아빠 모드':'직원 호출 요망';}
function showResult(){const t=S.total;if(!BEST||t<BEST){BEST=t;try{localStorage.setItem('kiosk_best',t.toFixed(1));}catch(e){}}
  const now=new Date(),no='A-'+String(Math.floor(Math.random()*900)+100);
  $('#rcpt').innerHTML=`<div class="rh1">버거천국 무인주문 · ${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</div><div class="rh2">주문번호 ${no}</div><div class="rl"></div>`+
   LV.map((l,i)=>`<div class="rrow"><span>${i+1}단계 ${l.name}</span><span>${fmt((S.times||[])[i]||0)}</span></div>`).join('')+
   `<div class="rl"></div><div class="rrow"><span>세트·라지 유혹 넘어감</span><span>${S.stats.upsell}회</span></div><div class="rrow"><span>타임아웃</span><span>${S.stats.timeout}회</span></div><div class="rrow"><span>주문 틀림</span><span>${S.stats.wrong}회</span></div><div class="rl"></div><div class="rtot"><span>합계</span><span>${fmt(t)}</span></div><div class="rrow" style="margin-top:4px"><span>판정</span><b>${grade(t)}</b></div><div class="rsmall">내 최고 기록 ${fmt(BEST)} · 이용해 주셔서 감사합니다</div>`;
  $('#result').classList.remove('hidden');}
const fmt=t=>t>=60?`${Math.floor(t/60)}분 ${Math.round(t%60)}초`:`${t.toFixed(1)}초`;
function makeCard(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const g=c.getContext('2d');const F='ui-monospace,Menlo,"Apple SD Gothic Neo",monospace';
  g.fillStyle='#2a2c30';g.fillRect(0,0,1080,1350);g.fillStyle='#fffdf6';g.fillRect(170,60,740,1230);
  g.fillStyle='#222';g.textAlign='center';g.font='500 30px '+F;g.fillText('버거천국 무인주문',540,130);g.font='800 64px '+F;g.fillText('키오스크 지옥',540,215);
  const dash=y=>{g.setLineDash([10,8]);g.strokeStyle='#999';g.lineWidth=2;g.beginPath();g.moveTo(210,y);g.lineTo(870,y);g.stroke();g.setLineDash([]);};dash(260);
  g.font='500 34px '+F;let y=320;LV.forEach((l,i)=>{g.textAlign='left';g.fillText(`${i+1}단계 ${l.name}`,220,y);g.textAlign='right';g.fillText(fmt((S.times||[])[i]||0),860,y);y+=58;});
  dash(y-20);y+=30;[[`세트·라지 유혹 넘어감`,S.stats.upsell+'회'],['타임아웃',S.stats.timeout+'회'],['주문 틀림',S.stats.wrong+'회']].forEach(([a,b])=>{g.textAlign='left';g.fillText(a,220,y);g.textAlign='right';g.fillText(b,860,y);y+=54;});
  dash(y-16);y+=50;g.font='800 58px '+F;g.textAlign='left';g.fillText('합계',220,y);g.textAlign='right';g.fillText(fmt(S.total),860,y);y+=80;
  g.font='700 44px '+F;g.textAlign='center';g.fillText(`판정: ${grade(S.total)}`,540,y);y+=90;
  g.font='500 32px '+F;g.fillStyle='#555';g.fillText('엄마 아빠는 몇 초 걸릴까?',540,y);return c;}
$('#bShare').onclick=async()=>{const c=makeCard();const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const text=`[키오스크 지옥] 햄버거 주문 5번에 ${fmt(S.total)} 걸림 (${grade(S.total)}) 엄마 아빠도 해봐 ${location.href.startsWith('http')?location.href:''}`;
  try{const f=new File([blob],'kiosk.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kiosk.png';document.body.appendChild(a);a.click();a.remove();try{await navigator.clipboard.writeText(text);toast('이미지 저장 + 공유 문구 복사됨');}catch(e){toast('이미지를 저장했어요');}};
$('#bStart').onclick=()=>{$('#title').classList.add('hidden');S.total=0;S.times=[];S.stats={upsell:0,timeout:0,wrong:0,fails:0};startLevel(0);};
$('#bRetry').onclick=()=>{$('#result').classList.add('hidden');S.total=0;S.times=[];S.stats={upsell:0,timeout:0,wrong:0,fails:0};startLevel(0);};
$('#tBest').textContent=BEST?('내 최고 기록 '+fmt(BEST)):'';
S.lv=0;S.mission=mkMission(1);$('#mLv').textContent='1단계 · 평범한 키오스크';$('#mItems').innerHTML='<span>주문서가 여기 나와요</span>';render();
requestAnimationFrame(loop);
window.__k={S,startLevel,makeCard,showResult,verify};
})();
</script>
<script>(function(){var G=(location.pathname.split('/').pop()||'index').replace('.html','')||'index';var on=/pages\.dev$|github\.io$/.test(location.hostname);function T(k){if(!on)return;try{fetch('https://abacus.jasoncameron.dev/hit/ddanjit-lab/'+G+'-'+k,{keepalive:true});}catch(e){}}window.__track=T;T('visit');document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button,a');if(!b)return;var id=b.id||'';if(id==='bStart'||id==='bPlay'||b.classList.contains('train'))T('start');else if(id==='bShare')T('share');else if(id==='bRetry'||id==='bAgain'||id==='bNext'||id==='bFailRetry')T('retry');else if(id==='bRevive'||id==='bFailAd')T('revive');},true);var r=document.getElementById('result');if(r&&window.MutationObserver){new MutationObserver(function(){if(!r.classList.contains('hidden'))T('end');}).observe(r,{attributes:true,attributeFilter:['class']});}})();</script>
