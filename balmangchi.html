<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>발망치</title>
<meta name="description" content="밤 11시, 1202호. 아랫집이 깨기 전에 할 일 끝내고 눕기.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;word-break:keep-all;height:100%;background:#26231f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#2b2824;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;background:rgba(38,35,31,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;z-index:10;overflow-y:auto}
.hidden{display:none!important}
.paper{width:100%;max-width:340px;background:#f6f2e8;padding:22px 20px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35);position:relative;font-size:13.5px;line-height:1.7}
.paper .nt{font-family:"AppleMyungjo","Nanum Myeongjo","Batang",serif;font-size:24px;font-weight:700;text-align:center;letter-spacing:12px;margin:0 0 4px 12px}
.paper .nh{text-align:center;font-weight:700;border-bottom:1px solid #2b2824;padding-bottom:8px;margin-bottom:10px;font-size:14px}
.paper p{margin:0 0 8px}
.paper ol{margin:0 0 10px;padding-left:18px}
.paper li{margin-bottom:2px}
.paper .sig{text-align:right;margin-top:12px;font-size:12.5px;position:relative;padding-right:6px}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:2px solid #c23b2a;border-radius:50%;color:#c23b2a;font-size:10px;font-weight:800;line-height:1.1;text-align:center;transform:rotate(-12deg);margin-left:6px;vertical-align:middle;opacity:.85}
.paper table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.paper td{border:1px solid #b9b1a3;padding:5px 7px}
.paper td:first-child{background:#ece6d9;width:42%}
.big{font-size:22px;font-weight:800;margin:4px 0}
.btn{width:100%;max-width:340px;border:0;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:#2b2824;color:#f6f2e8;border-radius:6px}
.btn.line{background:transparent;color:#f6f2e8;border:1px solid rgba(246,242,232,.45)}
.btn.link{background:none;color:rgba(246,242,232,.6);font-size:13px;padding:4px;text-decoration:underline;text-align:center}
.btns{display:flex;flex-direction:column;gap:8px;width:100%;align-items:center}
.adslot{display:none}
#toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:#2b2824;color:#f6f2e8;padding:8px 12px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none;white-space:nowrap}
</style>

<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="title" class="ov">
    <div class="paper">
      <div class="nt">공 지 문</div>
      <div class="nh">야간 층간소음 관련 협조 요청</div>
      <p>입주민 여러분 안녕하십니까. 최근 밤 11시 이후 걷는 소리(일명 '발망치')로 인한 민원이 계속 접수되고 있습니다.</p>
      <p>1202호 입주민께서는 아래 사항을 꼭 지켜 주시기 바랍니다.</p>
      <ol>
        <li>뒤꿈치를 들고 천천히 걸을 것<br><span style="color:#7a7063">(화면을 살살 끌면 천천히, 세게 끌면 쿵쿵)</span></li>
        <li>주방·욕실·현관·발코니 타일은 소리가 더 울림</li>
        <li>바닥에 굴러다니는 장난감 밟지 않기</li>
        <li>변기 물은 아래층이 시끄러울 때 내리기</li>
      </ol>
      <div class="sig">2026. 9. 27.<br>관리사무소장<span class="stamp">관리<br>사무소</span></div>
    </div>
    <div class="btns">
      <button class="btn" id="bStart">1일차 밤 시작</button>
      <div id="tBest" style="color:rgba(246,242,232,.6);font-size:13px"></div>
    </div>
  </div>

  <div id="result" class="ov hidden">
    <div class="paper" id="rPaper"></div>
    <div class="btns">
      <button class="btn" id="bNext">다음 날 밤</button>
      <button class="btn" id="bRevive">광고 보고 사과 쪽지 붙이기</button>
      <button class="btn line" id="bShare">발소리 지도 저장하기</button>
      <button class="btn line" id="bRetry">1일차부터 다시</button>
      <a class="btn link" href="index.html">다른 게임</a>
    </div>
    <div class="adslot"></div>
  </div>
  <div id="adov" class="ov hidden" style="z-index:30;color:#f6f2e8"><div style="width:300px;height:220px;border:1px solid rgba(246,242,232,.3);display:flex;align-items:center;justify-content:center">광고</div><div id="adt"></div></div>
  <div id="toast"></div>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const W=360,H=640,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v;
const F='-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const INK='#2b2824',PAPER='#f6f2e8';
let BEST=0;try{BEST=+localStorage.getItem('bal_best')||0;}catch(e){}

// ---------- floor plan (1202호) ----------
const X0=16,X1=344,Y0=92,Y1=612;
const ROOMS=[ // name, x,y,w,h, floor
 ['발코니',16,92,328,48,'tile'],['거실',16,146,204,206,'wood'],['침실',226,146,118,154,'wood'],
 ['복도',226,306,36,140,'wood'],['욕실',268,306,76,134,'tile'],['주방',16,358,204,162,'tile'],
 ['',226,446,118,94,'wood'],['현관',226,540,118,72,'tile'],['작은방',16,526,204,86,'wood']];
const LABEL={발코니:[250,122],거실:[118,176],침실:[258,172],복도:[244,420],욕실:[292,392],주방:[140,392],현관:[252,600],작은방:[118,556]};
const QUIET=[[60,188,130,112,.3,'놀이매트'],[232,188,48,102,.45,'러그']];
const WALLS=[
 [16,140,34,6],[190,140,50,6],[300,140,44,6],        // 발코니 벽 (미닫이 두 곳)
 [220,146,6,90],[220,280,6,26],                        // 거실|침실 (침실 문)
 [226,300,118,6],                                      // 침실 아래
 [262,306,6,24],[262,370,6,70],[268,440,76,6],         // 욕실 (욕실 문)
 [16,352,40,6],[180,352,46,6],                         // 거실|주방 (오픈 주방)
 [220,358,6,162],                                      // 주방|복도
 [16,520,150,6],[206,520,20,6],                        // 주방|작은방 (작은방 문)
 [220,526,6,86]];                                      // 작은방|현관
const FURN=[ // x,y,w,h,kind
 [22,98,38,38,'washer'],[150,98,70,8,'rack'],
 [206,168,10,60,'tv'],[20,196,26,108,'sofa'],[96,236,50,26,'table'],
 [286,178,54,96,'bed'],[300,150,40,22,'stand'],
 [306,312,30,34,'toilet'],[274,312,26,22,'basin'],[276,398,64,38,'tub'],
 [22,364,26,100,'counter'],[22,470,40,46,'fridge'],[110,410,70,48,'dining'],
 [30,580,70,24,'desk'],[140,590,70,18,'shelf'],[320,452,20,80,'shoes']];
const DOORS=[ // hinge x,y, length, closed angle, open angle
 [226,236,44,Math.PI/2,0],[268,330,40,Math.PI/2,0],[206,526,40,Math.PI,Math.PI/2],[330,606,50,Math.PI,-Math.PI/2]];
const SLIDES=[[50,141,76,2.4],[114,143.6,76,2.4],[240,141,32,2.4],[268,143.6,32,2.4]];
const CHORES=[
 {id:'water',label:'물 마시기',x:74,y:492,noise:9,t:1.1},
 {id:'dish',label:'설거지',x:62,y:414,noise:16,t:1.6},
 {id:'toilet',label:'변기 물 내리기',x:320,y:362,noise:34,t:1.0},
 {id:'laundry',label:'빨래 널기',x:185,y:122,noise:5,t:1.6},
 {id:'parcel',label:'택배 들여놓기',x:305,y:588,noise:22,t:1.2},
 {id:'light',label:'거실 불 끄기',x:36,y:170,noise:2,t:.7},
 {id:'charger',label:'충전기 챙기기',x:66,y:566,noise:3,t:.8}];
const BED={x:270,y:228};
function floorAt(x,y){for(const q of QUIET)if(x>q[0]&&x<q[0]+q[2]&&y>q[1]&&y<q[1]+q[3])return q[4];for(const r of ROOMS)if(x>=r[1]&&x<=r[1]+r[3]&&y>=r[2]&&y<=r[2]+r[4])return r[5]==='tile'?1.25:1;return 1;}
const SOLID=WALLS.concat(FURN);

// ---------- canvas ----------
const cv=$('#cv'),ctx=cv.getContext('2d');let DPR=1,SC=1,OX=0,OY=0;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2.5);cv.width=r.width*DPR|0;cv.height=r.height*DPR|0;SC=Math.min(r.width/W,r.height/H);OX=(r.width-W*SC)/2;OY=(r.height-H*SC)/2;}
addEventListener('resize',resize);resize();

const plan=document.createElement('canvas');plan.width=W*3;plan.height=H*3;
function line(g,a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();}
function drawFurn(g,f){const [x,y,w,h,k]=f;g.fillStyle='#fbf9f4';g.strokeStyle=INK;g.lineWidth=1;g.fillRect(x,y,w,h);g.strokeRect(x+.5,y+.5,w-1,h-1);
 g.lineWidth=.8;
 if(k==='bed'){g.strokeRect(x+w-14,y+6,9,h/2-9);g.strokeRect(x+w-14,y+h/2+3,9,h/2-9);line(g,x+w-20,y,x+w-20,y+h);line(g,x+8,y+4,x+w-26,y+h-4);}
 else if(k==='sofa'){g.strokeRect(x,y,7,h);g.strokeRect(x,y,w,8);g.strokeRect(x,y+h-8,w,8);line(g,x+7,y+h/2,x+w,y+h/2);}
 else if(k==='toilet'){g.strokeRect(x+4,y+2,w-8,9);g.beginPath();g.ellipse(x+w/2,y+h-12,9,10,0,0,7);g.stroke();}
 else if(k==='basin'){g.beginPath();g.ellipse(x+w/2,y+h/2+2,8,6,0,0,7);g.stroke();}
 else if(k==='tub'){g.beginPath();g.roundRect(x+4,y+4,w-8,h-8,9);g.stroke();g.beginPath();g.arc(x+w-12,y+h/2,2,0,7);g.stroke();}
 else if(k==='counter'){g.beginPath();g.roundRect(x+4,y+10,w-8,20,3);g.stroke();for(const yy of [y+58,y+80]){g.beginPath();g.arc(x+w/2,yy,6,0,7);g.stroke();}}
 else if(k==='fridge'){line(g,x,y+h*.42,x+w,y+h*.42);g.font='600 7px '+F;g.fillStyle='#7a7063';g.textAlign='center';g.fillText('냉장고',x+w/2,y+h*.75);}
 else if(k==='washer'){g.beginPath();g.arc(x+w/2,y+h/2+2,11,0,7);g.stroke();line(g,x+4,y+6,x+12,y+6);}
 else if(k==='rack'){for(let xx=x+6;xx<x+w;xx+=8)line(g,xx,y,xx,y+h);}
 else if(k==='dining'){for(const [cx,cy] of [[x+14,y-6],[x+w-14,y-6],[x+14,y+h+6],[x+w-14,y+h+6]]){g.strokeRect(cx-6,cy-4,12,8);}}
 else if(k==='shoes'){for(let yy=y+8;yy<y+h;yy+=8)line(g,x,yy,x+w,yy-6);}
 else if(k==='shelf'){for(let xx=x+10;xx<x+w;xx+=10)line(g,xx,y,xx,y+h);}
 else if(k==='stand'){g.beginPath();g.arc(x+w/2,y+h/2,5,0,7);g.stroke();}
 else if(k==='desk'){g.strokeRect(x+w/2-8,y-10,16,9);}
}
function buildPlan(){const g=plan.getContext('2d');g.setTransform(3,0,0,3,0,0);g.fillStyle='#26231f';g.fillRect(0,0,W,H);g.fillStyle='#e9e3d6';g.fillRect(X0,Y0,X1-X0,Y1-Y0);
 for(const r of ROOMS){const [,x,y,w,h,fl]=r;if(fl==='wood'){g.fillStyle='#dcc5a3';g.fillRect(x,y,w,h);g.strokeStyle='rgba(120,85,45,.18)';g.lineWidth=.6;for(let yy=y+9;yy<y+h;yy+=9){line(g,x,yy,x+w,yy);}g.strokeStyle='rgba(120,85,45,.12)';for(let yy=y;yy<y+h;yy+=9){let xx=x+((yy*7)%53);while(xx<x+w){line(g,xx,yy,xx,yy+9);xx+=58;}}}
  else{g.fillStyle='#ece9e1';g.fillRect(x,y,w,h);g.strokeStyle='rgba(60,55,50,.13)';g.lineWidth=.6;for(let xx=x;xx<x+w;xx+=15)line(g,xx,y,xx,y+h);for(let yy=y;yy<y+h;yy+=15)line(g,x,yy,x+w,yy);}}
 g.fillStyle='#dcc5a3';g.fillRect(220,236,6,44);g.fillRect(220,300,6,58);g.fillRect(56,352,124,6);g.fillRect(226,440,36,6);g.fillStyle='#ece9e1';g.fillRect(262,330,6,40);g.fillRect(166,520,40,6);g.fillRect(50,140,140,6);g.fillRect(240,140,60,6);
 g.strokeStyle=INK;g.lineWidth=1;line(g,226,540,320,540);
 for(const q of QUIET){g.fillStyle=q[5]==='러그'?'rgba(196,140,120,.35)':'rgba(140,175,130,.38)';g.fillRect(q[0],q[1],q[2],q[3]);g.strokeStyle='rgba(60,55,50,.35)';g.setLineDash([3,3]);g.strokeRect(q[0]+.5,q[1]+.5,q[2]-1,q[3]-1);g.setLineDash([]);}
 for(const f of FURN)drawFurn(g,f);
 g.fillStyle=INK;for(const w of WALLS)g.fillRect(w[0],w[1],w[2],w[3]);
 g.fillRect(X0-6,Y0-6,X1-X0+12,6);g.fillRect(X0-6,Y0-6,6,Y1-Y0+12);g.fillRect(X1,Y0-6,6,Y1-Y0+12);g.fillRect(X0-6,Y1,280-X0+6,6);g.fillRect(330,Y1,X1-330+6,6);
 g.strokeStyle=INK;for(const [hx,hy,len,ca,oa] of DOORS){g.lineWidth=1.6;line(g,hx,hy,hx+Math.cos(oa)*len,hy+Math.sin(oa)*len);g.lineWidth=.7;g.beginPath();let d=oa-ca;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;g.arc(hx,hy,len,ca,ca+d,d<0);g.stroke();}
 g.fillStyle='#fbf9f4';g.strokeStyle=INK;g.lineWidth=.8;for(const s of SLIDES){g.fillRect(s[0],s[1],s[2],s[3]);g.strokeRect(s[0],s[1],s[2],s[3]);}
 g.fillStyle='rgba(60,52,44,.55)';g.font='600 10px '+F;g.textAlign='center';for(const k in LABEL)g.fillText(k,LABEL[k][0],LABEL[k][1]);
 g.font='500 8px '+F;g.fillStyle='rgba(60,52,44,.5)';g.fillText('놀이매트',121,297);
}
buildPlan();

// ---------- state ----------
const G={on:false,night:1,t:0,dur:110,P:{x:150,y:230,vx:0,vy:0},anger:0,peak:0,steps:[],ripples:[],toys:[],chores:[],done:0,task:null,mask:null,nextMask:8,strideAcc:0,bangs:0,revived:false,lego:0,sumNoise:0,nSteps:0,shake:0,cap:null,end:null,tol:2.6,decay:3.5,input:{on:false,sx:0,sy:0,x:0,y:0},keys:{},bedReady:false,endAt:''};
function blocked(x,y,r){if(x<X0+r||x>X1-r||y<Y0+r||y>Y1-r)return true;for(const w of SOLID)if(x>w[0]-r&&x<w[0]+w[2]+r&&y>w[1]-r&&y<w[1]+w[3]+r)return true;return false;}
function collide(p,r){p.x=clamp(p.x,X0+r,X1-r);p.y=clamp(p.y,Y0+r,Y1-r);for(const w of SOLID){const cx=clamp(p.x,w[0],w[0]+w[2]),cy=clamp(p.y,w[1],w[1]+w[3]);const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);if(d<r){if(d>.001){p.x=cx+dx/d*r;p.y=cy+dy/d*r;}else p.y=w[1]-r;}}}
function setupNight(n){Object.assign(G,{night:n,t:0,anger:0,peak:0,steps:[],ripples:[],done:0,task:null,mask:null,nextMask:rnd(5,9),strideAcc:0,bangs:0,lego:0,sumNoise:0,nSteps:0,shake:0,end:null,bedReady:false,revived:false,cap:null});
  G.P={x:150,y:230,vx:0,vy:0};G.tol=Math.max(1.2,2.7-n*.35);G.decay=Math.max(1.6,3.6-n*.4);G.dur=Math.max(85,112-n*4);
  const pool=CHORES.slice().sort(()=>Math.random()-.5);const cnt=Math.min(6,2+n);G.chores=pool.slice(0,cnt).map(c=>Object.assign({},c,{prog:0,ok:false}));
  if(n>=2&&!G.chores.some(c=>c.id==='toilet'))G.chores[0]=Object.assign({},CHORES[2],{prog:0,ok:false});
  G.toys=[];let tries=0;const need=2+n*2;while(G.toys.length<need&&tries<500){tries++;const x=rnd(X0+12,X1-12),y=rnd(Y0+12,Y1-12);if(floorAt(x,y)<.6||blocked(x,y,10))continue;if(Math.hypot(x-G.P.x,y-G.P.y)<60)continue;if(G.chores.some(c=>Math.hypot(c.x-x,c.y-y)<24)||Math.hypot(BED.x-x,BED.y-y)<30)continue;
    if(x>212&&x<236&&y>228&&y<288)continue;if(x>254&&x<276&&y>322&&y<378)continue;if(x>158&&x<214&&y>512&&y<534)continue;
    G.toys.push({x,y,a:rnd(0,3),c:pick(['#c23b2a','#2f5fa7','#d9a21b','#3f8a4a'])});}
  G.on=true;caption(`${n}일차. 밤 11시. 아랫집은 이미 자고 있다.`);}
function caption(t,warn){G.cap={t,warn,life:2.6};}

// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='sine',v=.08,delay=0,f2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;const t=a.currentTime+delay;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
const sStep=l=>tone(70+l*3,.09,'sine',Math.min(.35,.02+l*.03),0,40);
const sBang=()=>{tone(90,.18,'square',.25,0,50);tone(90,.18,'square',.25,.28,50);};
const sDone=()=>tone(880,.12,'sine',.05);
const sLego=()=>{tone(1400,.06,'square',.08);tone(300,.3,'sawtooth',.07,.05,120);};

// ---------- input ----------
function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/SC,y:(e.clientY-r.top-OY)/SC};}
cv.addEventListener('pointerdown',e=>{ac();const p=toL(e);G.input={on:true,sx:p.x,sy:p.y,x:p.x,y:p.y,id:e.pointerId};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!G.input.on||e.pointerId!==G.input.id)return;const p=toL(e);G.input.x=p.x;G.input.y=p.y;});
const up=e=>{if(G.input.id===e.pointerId)G.input.on=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{G.keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault();});addEventListener('keyup',e=>{G.keys[e.key]=false;});

// ---------- step ----------
const VMAX=105,STRIDE=15;
const clock=()=>{const m=Math.floor(G.t/G.dur*120),hh=23+Math.floor(m/60);return `${hh>=24?'0'+(hh-24):hh}:${String(m%60).padStart(2,'0')}`;};
function step(dt){
  for(const r of G.ripples)r.life-=dt;G.ripples=G.ripples.filter(r=>r.life>0);G.shake=Math.max(0,G.shake-dt*2);
  if(G.cap){G.cap.life-=dt;if(G.cap.life<=0)G.cap=null;}
  if(!G.on)return;
  G.t+=dt;const P=G.P;
  let ix=0,iy=0,s=0;const k=G.keys;
  const kx=(k.ArrowRight||k.d?1:0)-(k.ArrowLeft||k.a?1:0),ky=(k.ArrowDown||k.s?1:0)-(k.ArrowUp||k.w?1:0);
  if(kx||ky){const l=Math.hypot(kx,ky);ix=kx/l;iy=ky/l;s=k.Shift?.42:1;}
  else if(G.input.on){const dx=G.input.x-G.input.sx,dy=G.input.y-G.input.sy,d=Math.hypot(dx,dy);if(d>4){ix=dx/d;iy=dy/d;s=clamp((d-4)/66,0,1);}}
  const tv=s*VMAX;P.vx+=(ix*tv-P.vx)*Math.min(1,dt*10);P.vy+=(iy*tv-P.vy)*Math.min(1,dt*10);
  const ox=P.x,oy=P.y;P.x+=P.vx*dt;P.y+=P.vy*dt;collide(P,8);
  const moved=Math.hypot(P.x-ox,P.y-oy),sp=moved/dt/VMAX;G.walk=(G.walk||0)+moved*.55;
  G.strideAcc+=moved;
  if(G.strideAcc>=STRIDE){G.strideAcc=0;let n=floorAt(P.x,P.y)*(.1+1.0*sp*sp)*8;if(G.mask)n*=.3;addNoise(n,P.x,P.y,true);}
  for(const t of G.toys)if(!t.hit&&Math.hypot(t.x-P.x,t.y-P.y)<8){t.hit=true;G.lego++;sLego();caption('블록을 밟았다. 소리는 삼켰는데 발은 이미 쿵.',true);addNoise(G.mask?14:40,t.x,t.y,false);G.shake=.6;}
  G.task=null;if(sp<.08){for(const c of G.chores)if(!c.ok&&Math.hypot(c.x-P.x,c.y-P.y)<18){G.task=c;c.prog+=dt;if(c.prog>=c.t){c.ok=true;G.done++;sDone();addNoise(G.mask?c.noise*.3:c.noise,c.x,c.y,false);if(c.noise>=15&&!G.mask)caption(c.label+'. 생각보다 소리가 컸다.',true);}break;}}
  G.bedReady=G.chores.every(c=>c.ok);
  if(G.bedReady&&Math.hypot(P.x-BED.x,P.y-BED.y)<20)return win();
  if(G.mask){G.mask.left-=dt;if(G.mask.left<=0){G.mask=null;G.nextMask=rnd(10,17)+G.night;caption('다시 조용해졌다.');}}
  else{G.nextMask-=dt;if(G.nextMask<=0){const m=pick([['아랫집 TV 소리가 커졌다. 지금이다.',6],['밖에서 오토바이가 지나간다.',3.2],['갑자기 비가 쏟아진다.',8],['옆집이 이 시간에 청소기를 돌린다.',5]]);G.mask={left:m[1],max:m[1]};caption(m[0]);}}
  G.anger=Math.max(0,G.anger-G.decay*dt);
  if(G.t>=G.dur)return lose('time');
}
function addNoise(n,x,y,isStep){G.ripples.push({x,y,r:5,max:10+n*2.4,life:.7,l:n});sStep(n);G.steps.push([x,y,n]);if(isStep){G.sumNoise+=n;G.nSteps++;}
  const ex=Math.max(0,n-G.tol);G.anger+=ex*.8;G.peak=Math.max(G.peak,G.anger);
  if(G.anger>=55&&G.bangs===0){G.bangs=1;sBang();G.shake=1;caption('쿵, 쿵. 아래층에서 천장을 쳤다.',true);try{navigator.vibrate&&navigator.vibrate([80,60,80]);}catch(e){}}
  if(G.anger>=82&&G.bangs===1){G.bangs=2;sBang();G.shake=1;caption('아래층에서 인터폰 수화기 드는 소리가 났다.',true);}
  if(G.anger>=100)lose('anger');}
function lose(why){if(!G.on)return;G.on=false;G.end=why;G.endAt=clock();tone(520,.3,'triangle',.08);tone(520,.3,'triangle',.08,.4);setTimeout(()=>showResult(false),900);}
function win(){G.on=false;G.end='win';G.endAt=clock();tone(392,.3,'sine',.06);tone(523,.4,'sine',.06,.15);if(G.night>BEST){BEST=G.night;try{localStorage.setItem('bal_best',BEST);}catch(e){}}setTimeout(()=>showResult(true),700);}

// ---------- render ----------
function drawMe(g,P){const spd=Math.hypot(P.vx,P.vy),mv=Math.min(1,spd/20),slow=spd>4&&spd<VMAX*.55;const x=P.x,fy=P.y+7-(slow?1:0);const sw=Math.sin(G.walk||0)*(slow?1.8:3.2)*mv;
  const down=P.vy>6||spd<6,side=Math.abs(P.vx)>Math.abs(P.vy)&&spd>6?Math.sign(P.vx):0;
  g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(x,P.y+7,7,2.4,0,0,7);g.fill();
  g.lineCap='round';g.strokeStyle='#5d6c8c';g.lineWidth=2.6;
  g.beginPath();g.moveTo(x-1.3,fy-8);g.lineTo(x-2.4+sw,fy);g.moveTo(x+1.3,fy-8);g.lineTo(x+2.4-sw,fy);g.stroke();
  g.fillStyle='#f0d2b0';g.beginPath();g.arc(x-2.4+sw,fy+.3,1.3,0,7);g.arc(x+2.4-sw,fy+.3,1.3,0,7);g.fill();
  const ax=slow?7.5:5.5,ay=slow?-12:-9;
  g.strokeStyle='#8a9bb8';g.lineWidth=2.2;g.beginPath();g.moveTo(x-4,fy-15.5);g.lineTo(x-ax-sw*.3,fy+ay);g.moveTo(x+4,fy-15.5);g.lineTo(x+ax+sw*.3,fy+ay);g.stroke();
  g.fillStyle='#f0d2b0';g.beginPath();g.arc(x-ax-sw*.3,fy+ay,1.3,0,7);g.arc(x+ax+sw*.3,fy+ay,1.3,0,7);g.fill();
  g.fillStyle='#8a9bb8';g.strokeStyle=INK;g.lineWidth=.7;g.beginPath();g.roundRect(x-4.6,fy-17.5,9.2,10.5,3);g.fill();g.stroke();
  g.fillStyle='#f0d2b0';g.beginPath();g.arc(x,fy-21.8,4.7,0,7);g.fill();g.stroke();
  g.fillStyle='#3a2d25';g.beginPath();if(down){g.arc(x,fy-22.6,4.8,Math.PI*1.05+side*.35,Math.PI*1.95+side*.35);g.closePath();}else{g.arc(x,fy-21.8,4.8,0,7);}g.fill();
  if(down&&side===0){g.fillStyle=INK;g.fillRect(x-2.1,fy-21.2,1.1,1.3);g.fillRect(x+1,fy-21.2,1.1,1.3);}
  else if(down){g.fillStyle=INK;g.fillRect(x+side*2-.5,fy-21.2,1.1,1.3);}
  g.fillStyle='#fff3c4';g.font='700 8px '+F;g.textAlign='center';g.fillText('나',x,fy-29);}
function mood(){const a=G.anger;return a<20?'잠듦':a<45?'뒤척임':a<55?'깸':a<82?'천장 두드림':'인터폰 드는 중';}
function render(){const g=ctx;g.setTransform(1,0,0,1,0,0);g.fillStyle='#26231f';g.fillRect(0,0,cv.width,cv.height);
  const sx=G.shake?(Math.random()-.5)*10*G.shake:0,sy=G.shake?(Math.random()-.5)*10*G.shake:0;
  g.setTransform(DPR*SC,0,0,DPR*SC,DPR*(OX+sx*SC),DPR*(OY+sy*SC));
  g.drawImage(plan,0,0,W,H);
  for(const t of G.toys){g.save();g.translate(t.x,t.y);g.rotate(t.a);g.fillStyle=t.hit?'rgba(0,0,0,.18)':t.c;g.fillRect(-4.5,-3,9,6);if(!t.hit){g.fillStyle='rgba(255,255,255,.45)';g.fillRect(-3,-2,2,2);g.fillRect(1,-2,2,2);}g.restore();}
  const P=G.P;const gr=g.createRadialGradient(P.x,P.y,24,P.x,P.y,125);gr.addColorStop(0,'rgba(18,20,34,0)');gr.addColorStop(1,'rgba(18,20,34,.6)');g.fillStyle=gr;g.fillRect(X0-6,Y0-6,X1-X0+12,Y1-Y0+12);
  for(const c of G.chores){if(c.ok){g.strokeStyle='rgba(246,242,232,.8)';g.lineWidth=2;g.beginPath();g.moveTo(c.x-5,c.y);g.lineTo(c.x-1,c.y+4);g.lineTo(c.x+6,c.y-5);g.stroke();continue;}
    const pu=.5+.5*Math.sin(performance.now()/300);g.fillStyle=`rgba(255,214,120,${.18+.12*pu})`;g.beginPath();g.arc(c.x,c.y,13,0,7);g.fill();g.strokeStyle='rgba(255,214,120,.9)';g.lineWidth=1.2;g.beginPath();g.arc(c.x,c.y,13,0,7);g.stroke();
    if(c.prog>0){g.strokeStyle='#fff3c4';g.lineWidth=3;g.beginPath();g.arc(c.x,c.y,13,-Math.PI/2,-Math.PI/2+Math.PI*2*c.prog/c.t);g.stroke();}
    g.font='700 9px '+F;g.textAlign='center';g.lineWidth=3;g.strokeStyle='rgba(20,20,30,.7)';g.strokeText(c.label,c.x,c.y-17);g.fillStyle='#fff3c4';g.fillText(c.label,c.x,c.y-17);}
  if(G.bedReady){const pu=.5+.5*Math.sin(performance.now()/260);g.strokeStyle=`rgba(255,243,196,${.5+.4*pu})`;g.lineWidth=2;g.setLineDash([4,3]);g.beginPath();g.arc(BED.x,BED.y,16,0,7);g.stroke();g.setLineDash([]);g.font='700 9px '+F;g.textAlign='center';g.fillStyle='#fff3c4';g.fillText('눕기',BED.x,BED.y-21);}
  for(const r of G.ripples){const k=1-r.life/.7;const col=r.l<G.tol?'200,220,190':r.l<G.tol*2.2?'240,200,110':'230,110,90';g.strokeStyle=`rgba(${col},${(1-k)*.9})`;g.lineWidth=1.6;g.beginPath();g.arc(r.x,r.y,r.r+(r.max-r.r)*k,0,7);g.stroke();}
  drawMe(g,P);
  if(G.task){g.fillStyle='#fff3c4';g.font='600 9px '+F;g.textAlign='center';g.fillText('가만히',P.x,P.y+19);}
  if(G.input.on&&G.on){const I=G.input;const dx=I.x-I.sx,dy=I.y-I.sy,d=Math.hypot(dx,dy),s=clamp((d-4)/66,0,1);g.strokeStyle='rgba(246,242,232,.35)';g.lineWidth=1;g.beginPath();g.arc(I.sx,I.sy,70,0,7);g.stroke();
    const kx=I.sx+(d>70?dx/d*70:dx),ky=I.sy+(d>70?dy/d*70:dy);g.fillStyle=s<.5?'rgba(200,220,190,.8)':s<.75?'rgba(240,200,110,.85)':'rgba(230,110,90,.9)';g.beginPath();g.arc(kx,ky,12,0,7);g.fill();}
  drawHUD(g);
  if(G.cap){const c=G.cap;g.globalAlpha=Math.min(1,c.life*2);g.fillStyle='rgba(20,18,16,.8)';g.fillRect(X0-6,Y0-6,X1-X0+12,24);g.fillStyle=c.warn?'#f3b09e':PAPER;g.font='600 12px '+F;g.textAlign='center';g.fillText(c.t,W/2,Y0+10);g.globalAlpha=1;}
  if(G.anger>55){g.fillStyle=`rgba(150,30,20,${(G.anger-55)/45*.22})`;g.fillRect(0,0,W,H);}}
function drawHUD(g){g.fillStyle='#26231f';g.fillRect(0,0,W,Y0-8);
  g.fillStyle=PAPER;g.font='700 24px ui-monospace,Menlo,monospace';g.textAlign='left';g.fillText(clock(),12,34);
  g.fillStyle='rgba(246,242,232,.55)';g.font='500 10px '+F;g.fillText(`${G.night}일차 · 01시 전에 눕기`,12,50);
  if(G.mask){g.fillStyle='#b9c9e0';g.fillText(`아래층 소음 ${Math.ceil(G.mask.left)}초`,12,66);}
  g.save();g.translate(104,6);g.rotate(-.025);g.fillStyle='#f4e79a';g.fillRect(0,0,150,74);g.fillStyle='rgba(0,0,0,.06)';g.fillRect(0,0,150,8);
  g.fillStyle=INK;g.font='700 10px '+F;g.textAlign='left';g.fillText('오늘 밤 할 일',8,19);g.font='500 10px '+F;
  G.chores.forEach((c,i)=>{const col=i%2,row=Math.floor(i/2);const x=8+col*72,y=34+row*14;g.strokeStyle=INK;g.lineWidth=.8;g.strokeRect(x,y-8,7,7);
    if(c.ok){g.beginPath();g.moveTo(x+1,y-4);g.lineTo(x+3,y-2);g.lineTo(x+8,y-9);g.stroke();}
    const t=c.label.length>6?c.label.slice(0,6)+'…':c.label;g.fillStyle=c.ok?'rgba(43,40,36,.45)':INK;g.fillText(t,x+10,y-1);if(c.ok)g.fillRect(x+10,y-4,g.measureText(t).width,1);});
  if(G.bedReady){g.fillStyle='#8a3b2a';g.font='700 10px '+F;g.fillText('→ 침대에 눕기',8,70);}
  g.restore();
  g.textAlign='left';g.fillStyle='rgba(246,242,232,.55)';g.font='500 10px '+F;g.fillText('아랫집 1102호',266,20);
  const a=clamp(G.anger/100,0,1);for(let i=0;i<5;i++){const on=a>i/5+.001;g.fillStyle=on?(i>=3?'#d9674f':i>=2?'#e3b25a':'#b9c9a8'):'rgba(246,242,232,.15)';g.fillRect(266+i*14,28,10,16);}
  g.fillStyle=a>.55?'#f3b09e':PAPER;g.font='700 12px '+F;g.fillText(mood(),266,62);}
let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;step(dt);render();requestAnimationFrame(frame);}

// ---------- result ----------
const avgStep=()=>G.nSteps?G.sumNoise/G.nSteps:0;
const dB=()=>Math.round(24+avgStep()*3.2);
function grade(){const d=dB();return d<32?'고양이 발':d<38?'조심성 있는 발':d<45?'평범한 발':d<55?'쿵쿵 발':'발망치';}
function showResult(win){const p=$('#rPaper');const rows=`<table><tr><td>평균 발소리</td><td>${dB()}dB (${grade()})</td></tr><tr><td>아래층 최고 반응</td><td>${G.peak>=82?'인터폰 수화기 듦':G.peak>=55?'천장 두드림':G.peak>=20?'뒤척임':'깨지 않음'}</td></tr><tr><td>밟은 블록</td><td>${G.lego}개</td></tr><tr><td>끝낸 일</td><td>${G.done} / ${G.chores.length}</td></tr></table>`;
  if(win)p.innerHTML=`<div class="nt" style="letter-spacing:6px;font-size:20px">오늘 밤 기록</div><div class="nh">${G.night}일차 · ${G.endAt} 취침</div><div class="big">조용히 누웠다.</div><p>아랫집 1102호는 아무것도 모른 채 자고 있다.</p>${rows}<div class="sig">최고 기록 ${BEST}일차</div>`;
  else if(G.end==='anger')p.innerHTML=`<div class="nt" style="letter-spacing:6px;font-size:20px">민원 접수 안내</div><div class="nh">접수 번호 ${Math.floor(rnd(1000,9999))} · 1102호 → 1202호</div><p>${G.night}일차 ${G.endAt}경 아래층 세대로부터 소음 민원이 접수되었습니다.</p><p>내용: "밤마다 쿵쿵거려서 잠을 못 자겠어요."</p>${rows}<div class="sig">관리사무소<span class="stamp">관리<br>사무소</span></div>`;
  else p.innerHTML=`<div class="nt" style="letter-spacing:6px;font-size:20px">오늘 밤 기록</div><div class="nh">${G.night}일차 · 01:00</div><div class="big">새벽 1시가 넘었다.</div><p>할 일을 다 못 끝냈다. 내일 출근인데.</p>${rows}`;
  $('#bNext').classList.toggle('hidden',!win);$('#bRevive').classList.toggle('hidden',win||G.revived||G.end!=='anger');$('#result').classList.remove('hidden');}
const Ads={rewarded(){return new Promise(r=>{const o=$('#adov');o.classList.remove('hidden');let n=3;$('#adt').textContent=n;const iv=setInterval(()=>{n--;if(n<=0){clearInterval(iv);o.classList.add('hidden');r(true);}else $('#adt').textContent=n;},1000);});}};
$('#bRevive').onclick=async()=>{if(!await Ads.rewarded())return;G.revived=true;G.anger=35;G.bangs=1;G.on=true;$('#result').classList.add('hidden');caption('1102호 문 앞에 "죄송합니다. 조심하겠습니다." 쪽지를 붙였다.');};
$('#bStart').onclick=()=>{ac();$('#title').classList.add('hidden');setupNight(1);};
$('#bNext').onclick=()=>{$('#result').classList.add('hidden');setupNight(G.night+1);};
$('#bRetry').onclick=()=>{$('#result').classList.add('hidden');setupNight(1);};
function makeCard(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const g=c.getContext('2d');g.fillStyle=PAPER;g.fillRect(0,0,1080,1350);
  g.fillStyle=INK;g.font='700 64px "AppleMyungjo","Nanum Myeongjo","Batang",serif';g.textAlign='center';g.fillText('1202호 발소리 기록',540,110);
  g.font='500 34px '+F;g.fillText(`${G.night}일차 · 평균 ${dB()}dB · ${grade()}`,540,170);g.fillRect(90,200,900,3);
  const s=2.0,ox=540-(X0+X1)/2*s,oy=230-(Y0-8)*s;g.save();g.translate(ox,oy);g.scale(s,s);g.drawImage(plan,0,0,W,H);
  for(const [x,y,n] of G.steps){const col=n<G.tol?'90,140,90':n<G.tol*2.2?'200,150,40':'190,60,40';g.fillStyle=`rgba(${col},.7)`;g.beginPath();g.arc(x,y,1.8+Math.min(6,n*.4),0,7);g.fill();}g.restore();
  g.fillStyle='#7a7063';g.font='500 28px '+F;g.fillText('초록 조용히 · 노랑 보통 · 빨강 쿵쿵',540,1300);return c;}
$('#bShare').onclick=async()=>{const c=makeCard();const blob=await new Promise(r=>c.toBlob(r,'image/png'));const text=`발망치 ${G.night}일차, 내 발소리 ${dB()}dB (${grade()}) ${location.href.startsWith('http')?location.href:''}`;
  try{const f=new File([blob],'balmangchi.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='balmangchi.png';document.body.appendChild(a);a.click();a.remove();try{await navigator.clipboard.writeText(text);toast('저장했어요. 공유 문구도 복사됨');}catch(e){toast('저장했어요');}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.opacity=0,2000);}
$('#tBest').textContent=BEST?('최고 기록 '+BEST+'일차'):'';
G.chores=CHORES.slice(0,4).map(c=>Object.assign({},c,{prog:0,ok:false}));
requestAnimationFrame(frame);
window.__bal={G,step,setupNight,makeCard,showResult,blocked,floorAt};
})();
